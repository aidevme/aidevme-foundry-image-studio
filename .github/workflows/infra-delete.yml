name: Infrastructure delete

# Deletes the resources that infra-deploy.yml created for one environment.
# Runs only when started manually from the Actions tab (workflow_dispatch).
#
# What it does, in order:
#   1. Checks the confirmation text and the repository variables.
#   2. Cancels the subscription deployment if it is still running (for example a stuck one).
#   3. Deletes the resource group rg-image-studio-<environment> and everything in it.
#   4. Purges soft-deleted resources so their names can be reused
#      (Foundry and Content Safety accounts, App Configuration, API Management, Key Vault).
#   5. Deletes the deployment record image-studio-<environment>.
#
# Select "Dry run" to list what would be deleted without deleting anything.
# Key Vault with purge protection cannot be purged; see the job summary for details.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to delete
        type: choice
        required: true
        options: [ dev ]
        default: dev
      confirm:
        description: Type the resource group name to confirm (rg-image-studio-<environment>)
        type: string
        required: true
      dry_run:
        description: Dry run - list what would be deleted, delete nothing
        type: boolean
        default: false
      purge_soft_deleted:
        description: Purge soft-deleted resources after deleting the resource group
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# Shares the group with infra-deploy.yml so a delete and a deploy never overlap.
concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}
  RESOURCE_GROUP: rg-image-studio-${{ inputs.environment }}
  DEPLOYMENT_NAME: image-studio-${{ inputs.environment }}
  DRY_RUN: ${{ inputs.dry_run }}
  PURGE: ${{ inputs.purge_soft_deleted }}

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A GitHub environment with the same name lets you require reviewers before deletion.
    environment: ${{ inputs.environment }}
    steps:
      - name: Verify the confirmation text
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$RESOURCE_GROUP" ]; then
            echo "::error::Confirmation text does not match. Type exactly: $RESOURCE_GROUP"
            exit 1
          fi

      - name: Verify repository variables
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          missing=0
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect what exists
        run: |
          {
            echo "### Infrastructure delete: ${ENVIRONMENT}"
            echo
            echo "Dry run: \`${DRY_RUN}\`. Purge soft-deleted: \`${PURGE}\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          state=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv 2>/dev/null || echo "none")
          echo "Subscription deployment '$DEPLOYMENT_NAME': $state"
          echo "- Subscription deployment \`$DEPLOYMENT_NAME\`: **$state**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$(az group exists --name "$RESOURCE_GROUP")" = "true" ]; then
            echo "Resource group '$RESOURCE_GROUP' contains:"
            az resource list --resource-group "$RESOURCE_GROUP" --query "[].{name:name,type:type}" -o table
            {
              echo "- Resource group \`$RESOURCE_GROUP\` exists with these resources:"
              echo
              echo '| Name | Type |'
              echo '| --- | --- |'
              az resource list --resource-group "$RESOURCE_GROUP" --query "[].[name,type]" -o tsv | awk -F'\t' '{print "| " $1 " | " $2 " |"}'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Resource group '$RESOURCE_GROUP' does not exist."
            echo "- Resource group \`$RESOURCE_GROUP\` does not exist." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Define helpers
        run: |
          cat > /tmp/helpers.sh <<'HELPERS'
          # Error handling for the delete steps.
          #   try "description" command...   Runs the command.
          #       success            -> recorded in the job summary
          #       "not found" error  -> the resource is already gone: a notice, not a failure
          #       any other error    -> an error annotation; the step fails at finish
          #   list "description" command...  Runs a list command and puts the output in LIST_OUT.
          #       An error is reported and counted as a failure (LIST_OUT stays empty).
          NOT_FOUND='NotFound|not found|does not exist|could not be found|ResourceGroupNotFound|DeletedAccountNotFound|ResourceNotFound|CanceledByUser|not in a state|cannot be cancel|already completed'
          FAILURES=0
          LIST_OUT=""
          note() { echo "- $*" >> "$GITHUB_STEP_SUMMARY"; }
          try() {
            local desc="$1"; shift
            local out
            if out=$("$@" 2>&1); then
              echo "OK: $desc"; note "$desc"; return 0
            fi
            if echo "$out" | grep -qiE "$NOT_FOUND"; then
              echo "::notice::$desc: already gone or not applicable; skipping."
              note "$desc: already gone or not applicable"; return 0
            fi
            echo "::error::$desc failed: $out"
            note "**Failed:** $desc"
            FAILURES=$((FAILURES + 1)); return 0
          }
          list() {
            local desc="$1"; shift
            local out
            LIST_OUT=""
            if out=$("$@" 2>&1); then
              LIST_OUT="$out"; return 0
            fi
            echo "::error::Could not list $desc: $out"
            note "**Failed to list:** $desc"
            FAILURES=$((FAILURES + 1)); return 0
          }
          finish() {
            if [ "$FAILURES" -gt 0 ]; then
              echo "::error::$FAILURES operation(s) failed. See the messages above."
              exit 1
            fi
          }
          HELPERS

      - name: Cancel a running deployment
        if: ${{ !inputs.dry_run }}
        run: |
          source /tmp/helpers.sh
          state=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv 2>/dev/null || echo "none")
          if [ "$state" = "Running" ] || [ "$state" = "Accepted" ]; then
            try "Cancel deployment $DEPLOYMENT_NAME ($state)" az deployment sub cancel --name "$DEPLOYMENT_NAME"
            sleep 60
          else
            echo "No running deployment to cancel (state: $state)."
            note "No running deployment to cancel (state: $state)"
          fi
          finish

      - name: Delete the resource group
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          source /tmp/helpers.sh
          if [ "$(az group exists --name "$RESOURCE_GROUP")" = "true" ]; then
            try "Delete resource group $RESOURCE_GROUP" az group delete --name "$RESOURCE_GROUP" --yes
          else
            echo "Resource group '$RESOURCE_GROUP' does not exist; nothing to delete."
            note "Resource group \`$RESOURCE_GROUP\` does not exist: nothing to delete"
          fi
          finish

      - name: Purge soft-deleted Foundry and Content Safety accounts
        if: ${{ !cancelled() && !inputs.dry_run && inputs.purge_soft_deleted }}
        run: |
          source /tmp/helpers.sh
          list "soft-deleted Cognitive Services accounts" az cognitiveservices account list-deleted --query "[].id" -o tsv
          ids=$(printf '%s\n' "$LIST_OUT" | grep -i "/resourceGroups/${RESOURCE_GROUP}/" || true)
          if [ -z "$ids" ]; then
            echo "No soft-deleted Cognitive Services accounts for $RESOURCE_GROUP."
            note "No soft-deleted Cognitive Services accounts"
          else
            while read -r id; do
              name="${id##*/}"
              location=$(echo "$id" | sed -E 's#.*/locations/([^/]+)/.*#\1#')
              try "Purge Cognitive Services account $name" az cognitiveservices account purge --name "$name" --location "$location" --resource-group "$RESOURCE_GROUP"
            done <<< "$ids"
          fi
          finish

      - name: Purge soft-deleted App Configuration stores
        if: ${{ !cancelled() && !inputs.dry_run && inputs.purge_soft_deleted }}
        run: |
          source /tmp/helpers.sh
          list "soft-deleted App Configuration stores" az appconfig list-deleted --query "[].[name,location,configurationStoreId]" -o tsv
          rows=$(printf '%s\n' "$LIST_OUT" | grep -i "/resourceGroups/${RESOURCE_GROUP}/" || true)
          if [ -z "$rows" ]; then
            echo "No soft-deleted App Configuration stores for $RESOURCE_GROUP."
            note "No soft-deleted App Configuration stores"
          else
            while IFS=$'\t' read -r name location _; do
              try "Purge App Configuration store $name" az appconfig purge --name "$name" --location "$location" --yes
            done <<< "$rows"
          fi
          finish

      - name: Purge soft-deleted API Management services
        if: ${{ !cancelled() && !inputs.dry_run && inputs.purge_soft_deleted }}
        run: |
          source /tmp/helpers.sh
          list "soft-deleted API Management services" az apim deletedservice list --query "[?starts_with(name, 'apim-${ENVIRONMENT}-')].[name,location]" -o tsv
          if [ -z "$LIST_OUT" ]; then
            echo "No soft-deleted API Management services for $ENVIRONMENT."
            note "No soft-deleted API Management services"
          else
            while IFS=$'\t' read -r name location; do
              try "Purge API Management service $name" az apim deletedservice purge --service-name "$name" --location "$location"
            done <<< "$LIST_OUT"
          fi
          finish

      - name: Purge soft-deleted Key Vaults
        if: ${{ !cancelled() && !inputs.dry_run && inputs.purge_soft_deleted }}
        run: |
          source /tmp/helpers.sh
          list "soft-deleted Key Vaults" az keyvault list-deleted --query "[?starts_with(name, 'kv-${ENVIRONMENT}-')].[name,properties.location,properties.purgeProtectionEnabled,properties.scheduledPurgeDate]" -o tsv
          if [ -z "$LIST_OUT" ]; then
            echo "No soft-deleted Key Vaults for $ENVIRONMENT."
            note "No soft-deleted Key Vaults"
          else
            while IFS=$'\t' read -r name location protected scheduled; do
              if [ "$protected" = "true" ]; then
                echo "::notice::Key Vault '$name' has purge protection and cannot be purged. It is reserved until $scheduled. The deploy workflow recovers it automatically."
                note "Key Vault \`$name\` has purge protection: not purged, reserved until \`$scheduled\`. The deploy workflow recovers it."
              else
                try "Purge Key Vault $name" az keyvault purge --name "$name" --location "$location"
              fi
            done <<< "$LIST_OUT"
          fi
          finish

      - name: Delete the deployment record
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          source /tmp/helpers.sh
          try "Delete deployment record $DEPLOYMENT_NAME" az deployment sub delete --name "$DEPLOYMENT_NAME"
          finish
