name: Infrastructure validate

# Validates the Bicep templates in bicep/.
# Runs only when started manually from the Actions tab (workflow_dispatch).
#   - Always: lints and compiles the templates and the parameter file, and reports placeholders.
#   - Optional: previews the changes against Azure with what-if (nothing is deployed).
#
# The what-if job runs in the GitHub environment of the same name, so it signs in with the
# environment:<name> federated credential. See bicep/README.md for the setup.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [ dev ]
        default: dev
      run_what_if:
        description: Also preview the changes against Azure (what-if)
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-validate-${{ inputs.environment }}
  cancel-in-progress: true

env:
  ENVIRONMENT: ${{ inputs.environment }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint Bicep
        run: az bicep lint --file bicep/main.bicep

      - name: Build Bicep
        run: az bicep build --file bicep/main.bicep --stdout > /dev/null

      - name: Build parameter file
        run: az bicep build-params --file bicep/main.${ENVIRONMENT}.bicepparam --stdout > /dev/null
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
          APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL || 'platform@example.com' }}

      - name: Report unresolved placeholders
        run: |
          if grep -nE "<[a-z][a-z0-9-]*>" "bicep/main.${ENVIRONMENT}.bicepparam"; then
            echo "::warning::The parameter file contains unresolved placeholders. The deploy workflow refuses to run until they are replaced."
          fi

  what-if:
    needs: validate
    if: ${{ inputs.run_what_if }}
    runs-on: ubuntu-latest
    # Uses the environment so the OIDC subject is environment:<name>.
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify repository variables
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          missing=0
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_LOCATION APIM_PUBLISHER_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            --location "$AZURE_LOCATION" \
            --name "image-studio-${ENVIRONMENT}" \
            --template-file bicep/main.bicep \
            --parameters "bicep/main.${ENVIRONMENT}.bicepparam"
