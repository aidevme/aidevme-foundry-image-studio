name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as you can.
        **Do not paste API keys, endpoints with secrets, or other credentials.**
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - Orchestrator agent
        - Specialist agent
        - Model routing (tiers)
        - MCP server (VS Code)
        - Agent skills
        - Microsoft product icons
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Which image model was in use, if any?
      options:
        - GPT-image-2.5 Flare
        - GPT-image-2.5 Sunburst
        - MAI-Image
        - Not applicable / unknown
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The prompt or request you sent and the steps that lead to the problem.
      placeholder: |
        1. Run ...
        2. Send the prompt ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant logs or screenshots. Remove any secrets first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, VS Code version, Python/Node version, Foundry region.
      placeholder: Windows 11, VS Code 1.9x, Python 3.12, Sweden Central
